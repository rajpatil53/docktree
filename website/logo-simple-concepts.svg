<svg width="1200" height="540" viewBox="0 0 1200 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .heading{font:700 23px Arial,sans-serif;letter-spacing:-.6px;fill:#17231C}.sub{font:14px Arial,sans-serif;fill:#69756C}.tag{font:700 11px Arial,sans-serif;letter-spacing:1.4px;fill:#718071}.dark-tag{fill:#A9BAAA}.word{font:800 37px Arial,sans-serif;letter-spacing:-2px;fill:#17231C}.note{font:14px Arial,sans-serif;fill:#69756C}.mono{font:700 27px monospace;letter-spacing:-4px}
  </style>
  <rect width="1200" height="540" fill="#F3F2EB"/>
  <text x="64" y="66" class="heading">Simpler Docktree logo directions</text>
  <text x="64" y="95" class="sub">Initials lead. The worktree reference stays intentionally quiet.</text>

  <rect x="64" y="138" width="336" height="330" rx="16" fill="#FAFBF6" stroke="#D4D9D0"/>
  <text x="92" y="178" class="tag">01 / SPLIT MONOGRAM</text>
  <g transform="translate(92 215)">
    <rect width="77" height="67" rx="12" fill="#17231C"/>
    <text x="16" y="45" class="mono" fill="#CBFF61">dt</text>
    <path d="M88 20H110M110 20V7M110 20V33" stroke="#74A85B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="114" cy="7" r="4" fill="#A9E46D"/><circle cx="114" cy="33" r="4" fill="#A9E46D"/>
  </g>
  <text x="92" y="335" class="word">docktree</text>
  <text x="92" y="372" class="note">A clear dt badge, with a small fork as a suffix.</text>

  <rect x="432" y="138" width="336" height="330" rx="16" fill="#E5F0DD" stroke="#BFD7B9"/>
  <text x="460" y="178" class="tag">02 / BRANCH LETTER</text>
  <g transform="translate(460 212)">
    <text x="0" y="56" style="font:800 70px Arial,sans-serif;letter-spacing:-7px;fill:#17231C">dt</text>
    <path d="M71 23V42M71 32H88M88 32V18M88 32V46" stroke="#6D9E60" stroke-width="4" stroke-linecap="round"/>
    <circle cx="91" cy="18" r="4" fill="#91CC63"/><circle cx="91" cy="46" r="4" fill="#91CC63"/>
  </g>
  <text x="460" y="335" class="word">docktree</text>
  <text x="460" y="372" class="note">The terminal-style “t” becomes the branch point.</text>

  <rect x="800" y="138" width="336" height="330" rx="16" fill="#17231C"/>
  <text x="828" y="178" class="tag dark-tag">03 / TWO NODES</text>
  <g transform="translate(828 214)">
    <circle cx="27" cy="34" r="28" fill="#F1F5E9"/>
    <circle cx="76" cy="34" r="28" fill="#A9E46D"/>
    <text x="14" y="43" style="font:700 24px monospace;letter-spacing:-3px;fill:#17231C">d</text>
    <text x="67" y="43" style="font:700 24px monospace;letter-spacing:-3px;fill:#17231C">t</text>
    <path d="M105 34H121M121 34V20M121 34V48" stroke="#A9E46D" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="828" y="335" style="font:800 37px Arial,sans-serif;letter-spacing:-2px;fill:#F1F5E9">docktree</text>
  <text x="828" y="372" style="font:14px Arial,sans-serif;fill:#A9BAAA">Two letters, two worktree nodes, one understated fork.</text>
</svg>
